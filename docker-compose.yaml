services:
  django-app:
    build:
      context: .
      dockerfile: dockerfiles/app/Dockerfile
    command: gunicorn restailor.wsgi:application --bind 0.0.0.0:8004 --workers 3 --timeout 120
    env_file:
      - .env
    depends_on:
      - db
      - redis
    ports:
      - "8004:8004"
    volumes:
      - media-data:/app/media
      - static-data:/app/static
    networks:
      - app-network
    restart: always

  db:
    image: postgres:17-alpine
    env_file:
      - .env
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file:
      - .env
    volumes:
      - redis:/data
    networks:
      - app-network
    restart: always

  celery:
    build:
      context: .
      dockerfile: dockerfiles/celery/Dockerfile
    command: celery -A restailor worker -l info -- concurrency 1
    env_file:
      - .env
    depends_on:
      - redis
      - db
    volumes:
      - media-data:/app/media
    networks:
      - app-network
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./dockerfiles/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media-data:/app/media
      - static-data:/app/static
    depends_on:
      - django-app
    networks:
      - app-network
    restart: always

networks:
  app-network:

volumes:
  pg-data:
  redis:
  media-data:
  static-data: